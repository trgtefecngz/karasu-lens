name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release

      - name: Package Windows release binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & scripts/package-release.ps1

      - name: Upload Windows release binary
        uses: actions/upload-artifact@v4
        with:
          name: klens-windows-x86_64
          path: dist/klens-v*-windows-x86_64.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release

      - name: Package Linux release binary
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk '
            /^\[workspace\.package\]$/ { in_sec = 1; next }
            /^\[/ { in_sec = 0 }
            in_sec && /^version[[:space:]]*=/ {
              gsub(/^version[[:space:]]*=[[:space:]]*"/, "")
              gsub(/".*$/, "")
              print
              exit
            }
          ' Cargo.toml)"
          if [[ -z "$VERSION" ]]; then
            echo "Could not parse [workspace.package] version from Cargo.toml" >&2
            exit 1
          fi
          mkdir -p dist
          OUT="dist/klens-v${VERSION}-linux-x86_64"
          cp target/release/klens "$OUT"
          chmod +x "$OUT"
          ls -la dist

      - name: Upload Linux release binary
        uses: actions/upload-artifact@v4
        with:
          name: klens-linux-x86_64
          path: dist/klens-v*-linux-x86_64
          if-no-files-found: error

  publish:
    name: Publish Multi-Platform Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]

    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: klens-*
          path: dist
          merge-multiple: true

      - name: Generate deterministic pure-LF SHA256SUMS.txt and release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          win_files=(dist/klens-v*-windows-x86_64.exe)
          linux_files=(dist/klens-v*-linux-x86_64)
          if [[ ${#win_files[@]} -ne 1 ]]; then
            echo "Expected exactly 1 Windows binary in dist/, found ${#win_files[@]}" >&2
            exit 1
          fi
          if [[ ${#linux_files[@]} -ne 1 ]]; then
            echo "Expected exactly 1 Linux binary in dist/, found ${#linux_files[@]}" >&2
            exit 1
          fi

          WIN_PATH="${win_files[0]}"
          LINUX_PATH="${linux_files[0]}"
          WIN_NAME="$(basename "$WIN_PATH")"
          LINUX_NAME="$(basename "$LINUX_PATH")"

          EXPECTED_WIN="klens-${TAG_NAME}-windows-x86_64.exe"
          EXPECTED_LINUX="klens-${TAG_NAME}-linux-x86_64"
          if [[ "$WIN_NAME" != "$EXPECTED_WIN" || "$LINUX_NAME" != "$EXPECTED_LINUX" ]]; then
            echo "Tag/version mismatch: tag=${TAG_NAME}, win=${WIN_NAME}, linux=${LINUX_NAME}" >&2
            exit 1
          fi

          chmod +x "$LINUX_PATH"

          # Generate a single deterministic (filename-sorted), pure-LF, BOM-free SHA256SUMS.txt.
          (
            cd dist
            mapfile -t sorted_bins < <(printf '%s\n' "$WIN_NAME" "$LINUX_NAME" | LC_ALL=C sort)
            sha256sum "${sorted_bins[@]}" > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

          # Fail-closed check: zero UTF-8 BOM and zero CR (0x0D) bytes in SHA256SUMS.txt.
          python3 - <<'PY'
          from pathlib import Path
          data = Path("dist/SHA256SUMS.txt").read_bytes()
          if data.startswith(b"\xef\xbb\xbf"):
              raise SystemExit("SHA256SUMS.txt unexpectedly contains a UTF-8 BOM")
          if b"\r" in data:
              raise SystemExit("SHA256SUMS.txt unexpectedly contains CR (0x0D) bytes")
          if not data.endswith(b"\n") or len(data.splitlines()) != 2:
              raise SystemExit("SHA256SUMS.txt must contain exactly 2 LF-terminated checksum lines")
          PY

          WIN_SHA="$(awk -v f="$WIN_NAME" '$2 == f { print $1 }' dist/SHA256SUMS.txt)"
          LINUX_SHA="$(awk -v f="$LINUX_NAME" '$2 == f { print $1 }' dist/SHA256SUMS.txt)"
          WIN_BYTES="$(stat -c%s "$WIN_PATH")"
          LINUX_BYTES="$(stat -c%s "$LINUX_PATH")"
          WIN_MB="$(awk -v b="$WIN_BYTES" 'BEGIN { printf "%.2f MB", b / 1048576 }')"
          LINUX_MB="$(awk -v b="$LINUX_BYTES" 'BEGIN { printf "%.2f MB", b / 1048576 }')"

          AUTO_NOTES="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$TAG_NAME" --jq .body)"

          cat > release-notes.md <<EOF
          ## Karasu Lens (\`klens\`) ${TAG_NAME}

          Single-binary, offline, deterministic Rust toolkit for AI coding agents and developers.

          ### Downloads & Verified Checksums

          | Platform | Binary | Size | SHA-256 |
          | :--- | :--- | :--- | :--- |
          | Windows x86_64 | \`${WIN_NAME}\` | ${WIN_MB} (${WIN_BYTES} bytes) | \`${WIN_SHA}\` |
          | Linux x86_64 (glibc, ubuntu-latest) | \`${LINUX_NAME}\` | ${LINUX_MB} (${LINUX_BYTES} bytes) | \`${LINUX_SHA}\` |

          ### Checksum Verification

          **Windows (PowerShell):**
          \`\`\`powershell
          (Get-FileHash -Algorithm SHA256 .\\${WIN_NAME}).Hash.ToLowerInvariant()
          # Compare with SHA256SUMS.txt (${WIN_SHA})
          \`\`\`

          **Linux:**
          \`\`\`bash
          sha256sum -c SHA256SUMS.txt --ignore-missing
          chmod +x ./${LINUX_NAME}
          \`\`\`

          ---

          ${AUTO_NOTES}
          EOF

      - name: Publish GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" -R "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber -R "$GH_REPO"
            gh release edit "$TAG_NAME" --notes-file release-notes.md -R "$GH_REPO"
          else
            gh release create "$TAG_NAME" dist/* \
              --title "Karasu Lens (klens) ${TAG_NAME}" \
              --notes-file release-notes.md \
              -R "$GH_REPO"
          fi
